# Traceability register: upstream behaviour -> Lean symbol -> theorem -> test.
#
# `scripts/traceability-check.py` validates it on every CI run: every
# `realises`/`theorem` symbol must resolve, every `test` path must exist.
#
# status: implemented | partial | tested | excluded | deviation
#   implemented  realised and proved
#   partial      realised, proof incomplete or covering a subset
#   tested       realised, deliberately tested rather than proved (say why)
#   excluded     out of scope, rejected by name
#   deviation    behaviour differs from upstream on purpose (say how)

[meta]
upstream_name = "pydantic-core (its JSON parser and serialiser)"
upstream_url = "https://github.com/pydantic/pydantic-core"
upstream_commit = "383eb95a19433754c0cecf7025b50c26b6d97a36"
upstream_license = "MIT"

# [[requirement]]
# id = "..."                  # stable id, e.g. "routing.first-match"
# upstream = "tests/test_x.py::test_y"   # or a docs section
# title = "..."
# status = "implemented"
# realises = ["LeanJson.Foo.bar"]
# theorem = ["LeanJson.Foo.bar_spec"]
# test = ["tests/Conformance.lean::name"]

[[requirement]]
id = "parse.document"
upstream = "tests/test_json.py::test_json_invalid"
title = "from_json parses a whole document: whitespace, one value, whitespace, end; errors carry jiter's kind, offset, line and column"
status = "implemented"
realises = ["LeanJson.from_json", "LeanJson.parse", "LeanJson.parseDocument", "LeanJson.JsonError.description"]
theorem = ["LeanJson.parse_print", "LeanJson.parse_canonical", "LeanJson.parsed_of_ref"]
test = ["tests/Conformance.lean::unterminated string", "tests/Conformance.lean::trailing comma, multi-line"]

[[requirement]]
id = "parse.prefix"
upstream = "tests/test_json.py::test_partial_parse"
title = "Parse one value from a cursor and report the end position (allow_partial itself is excluded)"
status = "implemented"
realises = ["LeanJson.parseAt", "LeanJson.parseValue"]
theorem = ["LeanJson.parse_print_ext", "LeanJson.step_progress", "LeanJson.parsedAt_of_ref"]
test = ["tests/Conformance.lean::partial input is an error", "tests/Props.lean::parseAt reads a value out of a concatenation"]

[[requirement]]
id = "parse.allow_partial"
upstream = "tests/test_json.py::test_partial_parse"
title = "from_json(allow_partial=True) returning the complete prefix of a truncated document"
status = "excluded"
realises = []
theorem = []
test = []

[[requirement]]
id = "print.compact"
upstream = "tests/test_json.py::test_to_json"
title = "to_json(value) is compact: ',' and ':' separators, no whitespace (Starlette JSONResponse)"
status = "implemented"
realises = ["LeanJson.to_json", "LeanJson.print", "LeanJson.printWith", "LeanJson.printBA"]
theorem = ["LeanJson.print_compact", "LeanJson.print_injective", "LeanJson.printBA_eq"]
test = ["tests/Conformance.lean::to_json([1, 2])", "tests/Props.lean::printBA agrees with printWith"]

[[requirement]]
id = "print.indent"
upstream = "tests/test_json.py::test_to_json"
title = "to_json(value, indent=k): serde_json pretty layout"
status = "implemented"
realises = ["LeanJson.PrintOpts", "LeanJson.PrintOpts.nl"]
theorem = ["LeanJson.parse_print_ext"]
test = ["tests/Conformance.lean::to_json([1, 2], indent=2)", "tests/Props.lean::parse (print v) = v, indent 2"]

[[requirement]]
id = "print.ensure_ascii"
upstream = "tests/test_json.py::test_to_json"
title = "to_json(value, ensure_ascii=True): non-ASCII as \\uXXXX, astral as surrogate pairs"
status = "implemented"
realises = ["LeanJson.escapeChar", "LeanJson.hex4"]
theorem = ["LeanJson.parseString_printString_ext", "LeanJson.parseEscape_pair"]
test = ["tests/Conformance.lean::to_json(['à', 'é'], indent=2, ensure_ascii=True)", "tests/Props.lean::ensure_ascii output is ASCII"]

[[requirement]]
id = "roundtrip.value"
upstream = "tests/test_json.py::test_to_json"
title = "Round trip: parse (print j) = .ok j, on any continuation, every print option"
status = "implemented"
realises = ["LeanJson.Codec", "LeanJson.valueCodec"]
theorem = ["LeanJson.from_json_to_json", "LeanJson.to_json_injective", "LeanJson.parse_print", "LeanJson.parseLossless_print", "LeanJson.parse_print_ext", "LeanJson.parseValue_ext", "LeanJson.Codec.decode_encode"]
test = ["tests/Props.lean::parse (print v) = v, compact"]

[[requirement]]
id = "roundtrip.string"
upstream = "tests/test_json.py::test_str"
title = "Strings: escapes \\\" \\\\ \\/ \\b \\f \\n \\r \\t \\uXXXX and surrogate pairs; raw UTF-8"
status = "implemented"
realises = ["LeanJson.parseString", "LeanJson.printString", "LeanJson.stringCodec"]
theorem = ["LeanJson.parseString_printString_ext", "LeanJson.string_ext", "LeanJson.strStep"]
test = ["tests/Conformance.lean::surrogate pair", "tests/Conformance.lean::escaped slash"]

[[requirement]]
id = "roundtrip.number"
upstream = "tests/test_json.py::test_int"
title = "Numbers: integer literals are ints of any size up to the limit, others exact normalised decimals; serde/ryu float layout"
status = "implemented"
realises = ["LeanJson.parseNumber", "LeanJson.printNumber", "LeanJson.numberCodec", "LeanJson.Decimal.normalize"]
theorem = ["LeanJson.parseNumber_printNumber_ext", "LeanJson.number_ext", "LeanJson.normalize_mul"]
test = ["tests/Conformance.lean::big integer", "tests/Conformance.lean::float layout"]

[[requirement]]
id = "number.limit"
upstream = "tests/validators/test_int.py::test_long_json"
title = "jiter's 4300-byte limit on a number's sign and integer digits: 'number out of range'"
status = "implemented"
realises = ["LeanJson.ParseCfg", "LeanJson.ParseCfg.intLenOk", "LeanJson.ErrorKind.numberOutOfRange"]
theorem = ["LeanJson.parseDocument_relax", "LeanJson.parseValue_relax"]
test = ["tests/Conformance.lean::number of 4301 digits", "tests/Conformance.lean::negative number of 4300 digits"]

[[requirement]]
id = "number.float.exact"
upstream = "tests/test_json.py::test_float"
title = "Floats are kept as exact decimals, not rounded to f64 at parse time (1e400 stays 1e+400, upstream inf)"
status = "deviation"
realises = ["LeanJson.Number.toFloat", "LeanJson.Decimal"]
theorem = []
test = ["tests/Conformance.lean::huge exponent kept exactly"]

[[requirement]]
id = "number.float.bridge"
upstream = "tests/serializers/test_simple.py::test_simple_serializers"
title = "Float values serialise as their shortest round-tripping decimal (ryu); inf/NaN as null"
status = "tested"
realises = ["LeanJson.Number.ofFloat?", "LeanJson.Number.toFloat"]
theorem = []
test = ["tests/Props.lean::Float -> shortest decimal -> Float is the identity on bits", "tests/Conformance.lean::float 42.31415"]

[[requirement]]
id = "keys.duplicates"
upstream = "tests/test_json.py::test_dict"
title = "Duplicate object keys collapse as from_json's dict does (last value, first position), while parsing; ParseCfg.dedupKeys := false keeps them; lookup is last-wins"
status = "implemented"
realises = ["LeanJson.Fields.add", "LeanJson.dictInsert", "LeanJson.ParseCfg", "LeanJson.Json.getObjVal?", "LeanJson.Json.lookupLast", "LeanJson.Json.dedupKeys"]
theorem = ["LeanJson.Fields.add_fresh", "LeanJson.Fields.mem_add", "LeanJson.parseMembers_ext", "LeanJson.fits_default", "LeanJson.parse_canonical"]
test = ["tests/Conformance.lean::duplicate keys: last value wins", "tests/Conformance.lean::duplicate keys collapse at every depth", "tests/Conformance.lean::dedupKeys := false keeps every member; Json.dedupKeys collapses them", "tests/Props.lean::dedupKeys keeps last values, distinct keys, first positions", "tests/Props.lean::parse (print v) = v, compact"]

[[requirement]]
id = "print.dumps"
upstream = "Python json.dumps (CPython 3.13.9): separators default to (', ', ': '), or (',', ': ') with indent"
title = "json.dumps-style separators (PrintOpts.spaced) and dumps with its defaults"
status = "implemented"
realises = ["LeanJson.dumps", "LeanJson.PrintOpts.sep", "LeanJson.PrintOpts.colon"]
theorem = ["LeanJson.parse_print", "LeanJson.parseLossless_print", "LeanJson.wsList_sep"]
test = ["tests/Conformance.lean::dumps([1, 2, 3])", "tests/Conformance.lean::dumps(..., indent=2)", "tests/Props.lean::parse (print v) = v, json.dumps separators"]

[[requirement]]
id = "access.index"
upstream = "Python dict/list indexing on from_json's result: data['name'], data[0]"
title = "data[\"name\"]? and data[i]? via GetElem? on Json and Option Json"
status = "tested"
realises = ["LeanJson.Json.getObjVal?", "LeanJson.Json.getArrVal?"]
theorem = []
test = ["tests/Conformance.lean::missing key and index are none", "tests/Props.lean::indexing: v[k]? is the last member named k, v[i]? the i-th element"]

[[requirement]]
id = "perf.memory"
upstream = "pydantic-core 2.50.1 from_json peak memory: 211 MB for a 20 MB flat array, 136 MB for a 60 MB object of repeated keys"
title = "Compact representation (Array, shared small integers, collapsing while parsing); peak memory asserted in CI"
status = "tested"
realises = ["LeanJson.smallInts", "LeanJson.Json.ofNumber", "LeanJson.Fields"]
theorem = ["LeanJson.Json.ofNumber_eq"]
test = ["tests/Bench.lean"]

[[requirement]]
id = "inf_nan"
upstream = "tests/test_json.py::test_inf_nan_allow"
title = "from_json reads NaN, Infinity, -Infinity by default (allow_inf_nan=True); allow_inf_nan=False rejects them with jiter's errors"
status = "implemented"
realises = ["LeanJson.ParseCfg.allowInfNan", "LeanJson.ParseCfg.strict", "LeanJson.Number.nan", "LeanJson.Number.inf", "LeanJson.Number.negInf", "LeanJson.from_json"]
theorem = ["LeanJson.from_json_to_json", "LeanJson.from_json_to_json_strict", "LeanJson.parse_finite", "LeanJson.parseNumber_printNumber_ext"]
test = ["tests/Conformance.lean::Infinity", "tests/Conformance.lean::NaN", "tests/Props.lean::strict parse of constants output: accepted iff the value is finite"]

[[requirement]]
id = "inf_nan.print"
upstream = "tests/serializers/test_simple.py::test_float_inf_and_nan_serializers"
title = "to_json inf_nan_mode: constants (NaN, Infinity, -Infinity; to_json's default), null, strings"
status = "implemented"
realises = ["LeanJson.InfNanMode", "LeanJson.printNumberIn", "LeanJson.to_json"]
theorem = ["LeanJson.from_json_to_json_strict", "LeanJson.print_compact", "LeanJson.printBA_eq"]
test = ["tests/Conformance.lean::inf, null mode", "tests/Conformance.lean::nan, strings", "tests/Props.lean::null and strings modes print strict RFC 8259 JSON (and round-trip finite values)"]

[[requirement]]
id = "recursion_limit"
upstream = "jiter recursion limit (pydantic-core 2.50.1 from_json)"
title = "jiter's nesting limit: a value inside 201 containers is 'recursion limit exceeded' at its offset (201 nested empty containers parse); enforced inside the parser (ParseCfg.maxDepth); element and member loops are tail-recursive, so neither depth nor width can exhaust the stack"
status = "implemented"
realises = ["LeanJson.ParseCfg.maxDepth", "LeanJson.ParseCfg.depthOk", "LeanJson.ErrorKind.recursionLimitExceeded", "LeanJson.parseValueWith", "LeanJson.parseElems"]
theorem = ["LeanJson.parse_height", "LeanJson.parseDocument_height", "LeanJson.fits_default", "LeanJson.from_json_to_json"]
test = ["tests/Conformance.lean::202 nested arrays", "tests/Conformance.lean::100000 open brackets", "tests/Props.lean::random nesting: depth ≤ 200 parses, deeper is recursion limit exceeded"]

[[requirement]]
id = "errors.offsets"
upstream = "tests/validators/test_json.py::test_any"
title = "Error kinds, offsets and jiter's line/column convention, incl. surrogate and UTF-8 errors"
status = "tested"
realises = ["LeanJson.ErrorKind", "LeanJson.lineCol", "LeanJson.ParseErr.toJsonError"]
theorem = []
test = ["tests/Conformance.lean::non-string key", "tests/Conformance.lean::lone trailing surrogate", "tests/Conformance.lean::invalid UTF-8 later"]

[[requirement]]
id = "notation.json"
upstream = "tests/test_json.py::test_to_jsonable_python_schema_serializer"
title = "json% literal notation with spliced Lean values (IntoJson), for handlers"
status = "tested"
realises = ["LeanJson.IntoJson", "LeanJson.expandJsonv"]
theorem = []
test = ["tests/Conformance.lean::nested objects, compact"]

[[requirement]]
id = "bridge.lean_json"
upstream = "core Lean.Json"
title = "Conversions to and from core Lean.Json (sorted keys, last duplicate wins)"
status = "tested"
realises = ["LeanJson.Json.toLean", "LeanJson.Json.ofLean"]
theorem = []
test = ["tests/Props.lean::Lean.Json bridge: ofLean (toLean v) = v on its common fragment"]

[[requirement]]
id = "total"
upstream = "jiter (total parsing)"
title = "Parser is total with no fuel: each production returns a Step (progress in its type), recursion is well founded on the remaining input"
status = "implemented"
realises = ["LeanJson.parseValueWith", "LeanJson.Step", "LeanJson.Step.lift", "LeanJson.skipWs", "LeanJson.parseStrBody"]
theorem = ["LeanJson.step_progress", "LeanJson.parseValueAt_progress", "LeanJson.parseValueAtD_eq"]
test = ["tests/Props.lean::random bytes: errors in bounds, results within the depth limit"]
