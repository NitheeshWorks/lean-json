name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gate: the library and both test executables build, no proof is
  # admitted, and every theorem reaches only Lean's three axioms.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with: { test: false, lint: false }
      - name: The gate is the pinned copy of stack-tools/Axioms.lean
        run: echo "$(cat scripts/Axioms.sha256)  scripts/Axioms.lean" | sha256sum -c
      - name: Verification gate (axioms, sorry/admit, partial, unsafe, implemented_by, extern)
        run: lake exe axioms LeanJson
      - name: Property tests
        run: lake exe props
      - name: Conformance
        run: lake exe conformance
      - name: json% next to Lean core's json%
        run: lake exe notation
      - name: Traceability
        run: python3 scripts/traceability-check.py
      - name: Memory diagnostics (not a gate)
        run: |
          cat /sys/kernel/mm/transparent_hugepage/enabled || true
          nproc; uname -r; ldd --version | head -1
          lake exe bench grow 20
          lake exe bench grow-exact 20
      - name: Memory and time benchmark (peak memory within 8x the input + 32 MB, 12x for ten million array elements; wide objects linear)
        run: |
          lake exe bench flat 20
          lake exe bench keys 60
          lake exe bench strings 20
          lake exe bench e2e 20
          lake exe bench wide 2 1000
          lake exe bench wide 20 15000
          lake exe bench dups 20 5000
          lake exe bench collide 4 300

  plausible:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with: { test: false, lint: false }
      - name: Build and run the plausible suite
        working-directory: tests/pbt
        run: |
          lake build
          ./.lake/build/bin/pbt
