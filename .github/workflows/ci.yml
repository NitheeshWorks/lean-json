name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gate: the library and both test executables build, no proof is
  # admitted, and every theorem reaches only Lean's three axioms.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with: { test: false, lint: false }
      - name: Verification gate (axioms, sorry/admit, partial, unsafe, implemented_by, extern)
        run: lake env lean --run scripts/Axioms.lean LeanJson
      - name: Property tests
        run: lake exe props
      - name: Conformance
        run: lake exe conformance
      - name: Traceability
        run: python3 scripts/traceability-check.py
      - name: Memory and time benchmark (peak memory within 8x the input + 32 MB; wide objects linear)
        run: |
          lake exe bench flat 20
          lake exe bench keys 60
          lake exe bench strings 20
          lake exe bench e2e 20
          lake exe bench wide 2 1000
          lake exe bench wide 20 15000
          lake exe bench dups 20 5000

  plausible:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with: { test: false, lint: false }
      - name: Build and run the plausible suite
        working-directory: tests/pbt
        run: |
          lake build
          ./.lake/build/bin/pbt
